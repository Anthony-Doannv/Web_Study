{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="surface p-4 p-lg-5"><h2 class="fw-bold mb-4">{% if account %}Cập nhật tài khoản{% else %}Tạo tài khoản mới{% endif %}</h2><form method="POST" class="row g-3">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-6"><label class="form-label fw-semibold">Họ và tên</label><input type="text" name="full_name" class="form-control" value="{{ account.full_name if account else '' }}" required></div><div class="col-md-6"><label class="form-label fw-semibold">Email</label><input type="email" name="email" class="form-control" value="{{ account.email if account else '' }}" required></div><div class="col-md-4"><label class="form-label fw-semibold">Vai trò</label><select name="role" class="form-select" required><option value="student" {% if account and account.role == 'student' %}selected{% endif %}>Học viên</option><option value="teacher" {% if account and account.role == 'teacher' %}selected{% endif %}>Giáo viên</option><option value="admin" {% if account and account.role == 'admin' %}selected{% endif %}>Admin</option></select></div><div class="col-md-4"><label class="form-label fw-semibold">Khối lớp</label><select name="grade_level" class="form-select"><option value="">-- Chỉ dùng cho học viên --</option>{% for grade in range(6, 13) %}<option value="{{ grade }}" {% if account and account.grade_level == grade %}selected{% endif %}>Lớp {{ grade }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label fw-semibold">Lớp học</label><input type="text" name="class_name" class="form-control" value="{{ account.class_name if account else '' }}"></div><div class="col-md-6"><label class="form-label fw-semibold">{% if account %}Mật khẩu mới{% else %}Mật khẩu{% endif %}</label><input type="text" name="password" class="form-control" placeholder="{% if account %}Để trống nếu không đổi{% else %}Mặc định 123456{% endif %}"></div><div class="col-12 d-flex gap-2 pt-2 flex-wrap"><button type="submit" class="btn btn-primary">{% if account %}Lưu thay đổi{% else %}Tạo tài khoản{% endif %}</button><a href="{{ url_for('admin.accounts') }}" class="btn btn-outline-light">Quay lại</a></div></form></div></div></div>
{% endblock %}
