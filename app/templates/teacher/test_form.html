{% extends "base.html" %}
{% block content %}
<div class="surface p-4 p-lg-5">
  <h2 class="fw-bold mb-4">{% if item %}Sửa bài kiểm tra{% else %}Thêm bài kiểm tra{% endif %}</h2>
  <form method="post" class="row g-3">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-7"><label class="form-label">Tiêu đề</label><input class="form-control" name="title" value="{{ item.title if item else '' }}" placeholder="Ví dụ: Kiểm tra chương 2 Toán lớp 8"></div>
    <div class="col-md-2"><label class="form-label">Lớp</label><input class="form-control" type="number" name="grade_level" value="{{ item.grade_level if item else '' }}" required></div>
    <div class="col-md-3"><label class="form-label">Chương</label><input class="form-control" type="number" name="chapter" value="{{ item.chapter if item and item.test_type == 'chapter' else '' }}" placeholder="Chỉ dùng cho kiểm tra chương"></div>
    <div class="col-md-4"><label class="form-label">Môn</label>
      <select class="form-select" name="subject_id" required>
        {% for s in subjects %}
          <option value="{{ s.id }}" {% if item and item.subject_id == s.id %}selected{% endif %}>{{ s.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-5"><label class="form-label">Loại kiểm tra</label>
      <select class="form-select" name="test_type">
        <option value="chapter" {% if not item or item.test_type == 'chapter' %}selected{% endif %}>Kiểm tra theo chương</option>
        <option value="midterm_hk1" {% if item and item.test_type == 'midterm_hk1' %}selected{% endif %}>Kiểm tra giữa học kì 1</option>
        <option value="midterm_hk2" {% if item and item.test_type == 'midterm_hk2' %}selected{% endif %}>Kiểm tra giữa học kì 2</option>
        <option value="final_hk1" {% if item and item.test_type == 'final_hk1' %}selected{% endif %}>Kiểm tra cuối học kì 1</option>
        <option value="final_hk2" {% if item and item.test_type == 'final_hk2' %}selected{% endif %}>Kiểm tra cuối học kì 2</option>
        <option value="term" {% if item and item.test_type == 'term' %}selected{% endif %}>Kiểu cũ (term)</option>
      </select>
    </div>
    <div class="col-md-3 d-flex align-items-end"><div class="small text-muted">Các mốc giữa kì và cuối kì chỉ dùng cho bài kiểm tra, không hiển thị bài học hoặc bài tập.</div></div>
    <div class="col-12"><label class="form-label">Hướng dẫn</label><textarea class="form-control" rows="6" name="instructions" required>{{ item.instructions if item else '' }}</textarea></div>
    <div class="col-12"><label class="form-label">Đáp án mô tả</label><textarea class="form-control" rows="4" name="answer_key">{{ item.answer_key if item else '' }}</textarea></div>
    <div class="col-12 d-flex gap-2 flex-wrap">
      <button class="btn btn-primary">Lưu</button>
      <a class="btn btn-outline-light" href="{{ url_for('teacher.tests') }}">Quay lại</a>
    </div>
  </form>
</div>
{% endblock %}
