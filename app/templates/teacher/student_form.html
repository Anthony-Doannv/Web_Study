{% extends "base.html" %}
{% block content %}
<div class="teacher-shell">
  {% set active = 'dashboard' %}
  {% include '_partials/teacher_sidebar.html' %}
  <main>
    <div class="page-header-card mb-4">
      <div class="header-copy">
        <h2 class="page-title mb-1">Cập nhật học viên</h2>
        <p class="text-muted mb-0">Điều chỉnh nhanh thông tin cơ bản để danh sách lớp học luôn đồng bộ.</p>
      </div>
      <div class="page-header-actions">
        <a href="{{ url_for('teacher.students') }}" class="btn btn-outline-light">Quay lại quản lý học viên</a>
      </div>
    </div>
    <div class="surface p-4 p-lg-5">
      <form method="POST" class="row g-3 teacher-form-grid">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="col-md-6">
          <label class="form-label">Họ và tên</label>
          <input type="text" name="full_name" class="form-control" value="{{ student.full_name }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" value="{{ student.email }}" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Khối lớp</label>
          <select name="grade_level" class="form-select" required>
            {% for grade in range(6, 13) %}
            <option value="{{ grade }}" {% if student.grade_level == grade %}selected{% endif %}>Lớp {{ grade }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Lớp học</label>
          <input type="text" name="class_name" class="form-control" value="{{ student.class_name or '' }}" placeholder="Ví dụ: 8A2">
        </div>
        <div class="col-md-4">
          <label class="form-label">Mật khẩu mới</label>
          <input type="text" name="password" class="form-control" placeholder="Để trống nếu không đổi">
        </div>
        <div class="col-12 d-flex gap-2 flex-wrap pt-2">
          <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
          <a href="{{ url_for('teacher.students') }}" class="btn btn-outline-light">Hủy</a>
        </div>
      </form>
    </div>
  </main>
</div>
{% endblock %}
